<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}QuizBuzz{% endblock %}
    </title>

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <!-- PWA Manifest -->
    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <!-- Browser Icon -->
    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{{ url_for('static', filename='icon-192.png') }}"
    >

    <!-- Mobile / Apple Icon -->
    <link
        rel="apple-touch-icon"
        href="{{ url_for('static', filename='icon-192.png') }}"
    >

    <meta
        name="theme-color"
        content="#833ab4"
    >

</head>


<body>


<nav class="navbar">

    <div class="logo">

        <span class="logo-icon">
            ⚡
        </span>

        QuizBuzz

    </div>


    {% if session.get("user_id") %}

    <div class="nav-links">

        <a href="{{ url_for('index') }}">
            Home
        </a>

        <a href="{{ url_for('notes') }}">
            Notes
        </a>

        <a href="{{ url_for('leaderboard') }}">
            Leaderboard
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

    {% endif %}

</nav>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function () {

            navigator.serviceWorker
                .register(
                    "{{ url_for(
                        'static',
                        filename='service-worker.js'
                    ) }}"
                )
                .catch(
                    function (error) {

                        console.log(
                            "Service Worker error:",
                            error
                        );

                    }
                );

        }
    );

}

</script>


</body>

</html>
