{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Login</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <div class="password-wrapper">
            <input type="password" name="password" id="password" placeholder="Password" required>
            <span class="toggle-eye" onclick="togglePassword('password', this)">👁️</span>
        </div>
        <button type="submit">Login</button>
    </form>
    <p>Account nahi hai? <a href="{{ url_for('register') }}">Register karein</a></p>
</div>
<script>
function togglePassword(id, el) {
    const input = document.getElementById(id);
    if (input.type === "password") { input.type = "text"; el.textContent = "🙈"; }
    else { input.type = "password"; el.textContent = "👁️"; }
}
</script>
{% endblock %}
