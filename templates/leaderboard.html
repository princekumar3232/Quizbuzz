{% extends "base.html" %}
{% block title %}Leaderboard{% endblock %}
{% block content %}
<h2>🏆 Leaderboard</h2>
<table class="leaderboard-table">
    <tr><th>#</th><th>Username</th><th>Best Score</th></tr>
    {% for user in top_users %}
    <tr>
        <td>{{ loop.index }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.best_score }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
