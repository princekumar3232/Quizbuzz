{% extends "base.html" %}

{% block title %}
Checkpoint
{% endblock %}

{% block content %}

<div class="checkpoint-card">

    <h2>🎯 Checkpoint</h2>

    <p>
        {{ q_index }} questions complete.
    </p>

    <h3>
        Current Score:
        {{ score }}
    </h3>

    <a
        class="btn"
        href="{{ url_for('question') }}"
    >
        Continue →
    </a>

</div>

{% endblock %}
