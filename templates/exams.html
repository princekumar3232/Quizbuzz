{% extends "base.html" %}

{% block title %}
{{ category_label }} - Exams
{% endblock %}

{% block content %}

<div class="page-header">
    <h2>{{ category_label }}</h2>
    <p>Exam / Question Bank select karein</p>
</div>

<div class="exam-grid">

    {% for exam_name, subjects in exams.items() %}

    <a
        class="exam-card"
        href="{{ url_for(
            'subjects',
            category=category,
            exam=exam_name
        ) }}"
    >

        <div class="exam-icon">
            📝
        </div>

        <div class="exam-title">
            {{ exam_name }}
        </div>

        <div class="exam-count">
            {{ subjects|length }} Subjects
        </div>

    </a>

    {% endfor %}

</div>

<a
    href="{{ url_for('index') }}"
    class="back-btn"
>
    ← Home
</a>

{% endblock %}
