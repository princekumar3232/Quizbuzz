{% extends "base.html" %}

{% block title %}
Result
{% endblock %}

{% block content %}

<div class="result-card">

    <h2>🎉 Test Complete!</h2>

    <p class="score-text">
        {{ score }} / {{ total }}
    </p>

    <p>
        Percentage:

        {% if total > 0 %}
            {{ ((score / total) * 100)|round(2) }}%
        {% else %}
            0%
        {% endif %}

    </p>

    <br>

    <a
        class="btn"
        href="{{ url_for('index') }}"
    >
        🏠 Home
    </a>

    <a
        class="btn"
        href="{{ url_for('leaderboard') }}"
    >
        🏆 Leaderboard
    </a>

</div>

{% endblock %}
